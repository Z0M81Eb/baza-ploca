name: Scout Engine (Izviđač)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL trgovine za izviđanje'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Postavljanje Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacija biblioteka
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper curl_cffi beautifulsoup4 lxml

      - name: Pokreni izviđača
        run: python scout.py
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}

      - name: Spremi Scout Log u repozitorij
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Scout"
          git add logs/scout_report.log || true
          git commit -m "Scout izvještaj ažuriran" || true
          git push
