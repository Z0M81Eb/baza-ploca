name: Scout Engine (Izviđač)

on:
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Postavljanje Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacija biblioteka
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4 lxml

      - name: Pokreni izviđača
        run: python scout.py
