name: Master Scraper Engine

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_scraper:
        description: 'Upiši ALL za sve scrapere ili naziv skripte (npr. scraper_ezop.py ili samo ezop)'
        required: false
        default: 'ALL'

jobs:
  # 1. POSAO: Određuje pokrećemo li SVE scrapere paralelno ili samo JEDAN odabrani za testiranje
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Pronađi Python scrapere za pokretanje
        id: set-matrix
        run: |
          TARGET="${{ github.event.inputs.target_scraper }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "ALL" ]; then
            SCRIPTS=$(ls scraper_*.py | jq -R -s -c 'split("\n")[:-1]')
          else
            # Ako korisnik upiše samo "ezop", automatski pretvori u "scraper_ezop.py"
            if [[ "$TARGET" != scraper_* ]]; then
              TARGET="scraper_${TARGET}"
            fi
            if [[ "$TARGET" != *.py ]]; then
              TARGET="${TARGET}.py"
            fi
            if [ ! -f "$TARGET" ]; then
              echo "GREŠKA: Skripta $TARGET ne postoji u repozitoriju!"
              exit 1
            fi
            SCRIPTS=$(echo "$TARGET" | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "Pokrećem skripte: $SCRIPTS"
          echo "matrix=$SCRIPTS" >> $GITHUB_OUTPUT

  # 2. POSAO: Izvršava odabrane scrapere (1 ako testiraš pojedinačno, ili do 15 paralelno ako ide ALL)
  run_scrapers:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        script: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Postavljanje Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacija biblioteka
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper curl_cffi beautifulsoup4 lxml

      - name: Pokretanje scrapera i snimanje loga
        run: |
          mkdir -p out_data/logs
          SCRIPT_NAME="${{ matrix.script }}"
          LOG_FILE="out_data/logs/${SCRIPT_NAME%.py}.log"
          
          # Označavamo točan trenutak početka kako bismo spremili SAMO CSV koji ova skripta promijeni
          touch .scrape_start
          sleep 1
          
          echo "=== IZVJEŠTAJ RADA: $SCRIPT_NAME ===" > "$LOG_FILE"
          echo "Vrijeme pokretanja (UTC): $(date '+%d.%m.%Y. %H:%M:%S')" >> "$LOG_FILE"
          echo "----------------------------------------" >> "$LOG_FILE"
          
          set +e
          python -u "$SCRIPT_NAME" 2>&1 | tee -a "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          echo "----------------------------------------" >> "$LOG_FILE"
          echo "Vrijeme završetka (UTC): $(date '+%d.%m.%Y. %H:%M:%S') | Kod izlaza: $EXIT_CODE" >> "$LOG_FILE"
          
          # Kopiramo ISKLJUČIVO CSV datoteke koje je ova skripta upravo kreirala ili ažurirala!
          find . -maxdepth 1 -name "*.csv" -newer .scrape_start -exec cp {} out_data/ \;

      - name: Predaja rezultata završnom sakupljaču
        uses: actions/upload-artifact@v4
        with:
          name: rezultat-${{ matrix.script }}
          path: out_data/
          if-no-files-found: ignore
          overwrite: true

  # 3. POSAO: Sakuplja nove CSV-ove i logove te radi JEDAN siguran Commit i Push
  commit_results:
    needs: run_scrapers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Preuzmi sve obrađene CSV-ove i logove
        uses: actions/download-artifact@v4
        with:
          path: collected_outputs

      - name: Spoji nove podatke i spremi na GitHub
        run: |
          mkdir -p logs
          find collected_outputs -name "*.csv" -exec cp {} . \;
          find collected_outputs -name "*.log" -exec cp {} logs/ \;

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Master Action"
          git add *.csv logs/*.log 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "Master Sync: Automatsko ažuriranje kataloga i logova"
            git pull --rebase origin main
            git push
          else
            echo "Nema promjena za spremanje."
          fi
